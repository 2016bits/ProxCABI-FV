schema_version: "v2.0"
project: "ProxCABI-FV-SSSD-smoke"
seed: 13

paths:
  data_dir: "data"
  output_root: "outputs/v2"
  proxy_artifact: "outputs/v2/proxy_artifacts/fever"
  pair_pool_train: "outputs/v2/frozen_data/fever_cf_train.jsonl"
  pair_pool_val: "outputs/v2/frozen_data/fever_cf_dev_select.jsonl"
  dev_select: "outputs/v2/frozen_data/dev_select.jsonl"

data:
  dataset: "FEVER"
  train_split: "train"
  select_split: "dev_select"
  calib_split: "dev_calib"
  report_split: "dev_report"
  ood_split: "symmetric"
  pair_required_verified: true
  allow_unverified_semantic: false
  max_length: 128
  max_train_samples: 96
  max_eval_samples: 96

proxy:
  mode: "structured"
  fit_on: "base_train_only"
  freeze_pi0: true
  proxy_embedding_dim: 32

model:
  backbone: "hf-internal-testing/tiny-random-roberta"
  dropout: 0.1
  primary_head: "standardized"
  train_fact_head: true
  train_g_head: true
  train_q_head: true
  train_h_head: true
  enable_bridge_alignment: true

loss:
  lambda_std: 1.0
  lambda_fact: 0.25
  lambda_g: 0.25
  lambda_h: 0.5
  lambda_proxy: 0.1
  lambda_bridge: 0.05
  lambda_invariance: 0.1
  lambda_semantic: 0.1
  semantic_margin: 0.5
  js_eps: 1.0e-8

sampling:
  mode: "uniform"
  pair_budget: 0

train:
  total_optimizer_steps: 10
  batch_size: 8
  grad_accumulation_steps: 1
  eval_batch_size: 16
  lr: 5.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.0
  amp: false
  gradient_clip_norm: 1.0
  checkpoint_interval_steps: 5
  num_workers: 0
  device: "auto"
  selection_metric: "macro_f1_standardized"
  early_stop_on_ood: false

experiment:
  variants: ["M1"]
  seeds: [13]
  report_per_sample_predictions: true
  forbid_test_time_selection: true
